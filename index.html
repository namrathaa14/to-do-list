
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>My Tasks</h1>
      <p>Make today productive.</p>
    </header>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        aria-label="New task"
      >
      <button type="submit" class="add-btn">+ Add</button>
    </form>

    <div class="filters" aria-label="Filter tasks">
      <button type="button" class="filter active"
        data-filter="all">All</button>
      <button type="button" class="filter"
        data-filter="pending">Pending</button>
      <button type="button" class="filter"
        data-filter="completed">Completed</button>
    </div>

    <p id="task-count" class="task-count">0 tasks</p>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message">
      No tasks yet. Add your first task!
    </p>

    <footer>
      <span>Small steps make a big difference.</span>
    </footer>
  </main>
</body>
</html>
